name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: deepsea-edna-api

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Run Trivy vulnerability scanner on image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
          format: "sarif"
          output: "trivy-image-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-image-results.sarif"
        continue-on-error: true

      - name: Test Docker image
        if: github.event_name != 'pull_request'
        run: |
          # Get the first tag
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Testing image: $TAG"

          # Run container in background
          docker run -d --name test-container -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379 \
            $TAG

          # Wait for container to start
          sleep 10

          # Test health endpoint
          curl -f http://localhost:8000/health || exit 1

          # Stop container
          docker stop test-container
          docker rm test-container

          echo "✅ Docker image test passed!"

      - name: Generate build report
        if: github.event_name != 'pull_request'
        run: |
          echo "# Docker Build Report" > docker-report.md
          echo "" >> docker-report.md
          echo "## Image Details" >> docker-report.md
          echo "- **Repository**: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}" >> docker-report.md
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> docker-report.md
          echo "- **Build Date**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> docker-report.md
          echo "- **Commit SHA**: ${{ github.sha }}" >> docker-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> docker-report.md

      - name: Upload build report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: docker-report.md
