name: Docker Build and Push

on:
  push:
    branches: [main, develop]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: deepsea-edna-api

jobs:
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: deepsea-edna-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate build report
        run: |
          echo "# Docker Build Report" > docker-report.md
          echo "" >> docker-report.md
          echo "## Build Details" >> docker-report.md
          echo "- **Build Date**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> docker-report.md
          echo "- **Commit SHA**: ${{ github.sha }}" >> docker-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> docker-report.md
          echo "- **Event**: ${{ github.event_name }}" >> docker-report.md
          echo "" >> docker-report.md
          echo "## Note" >> docker-report.md
          echo "Docker Hub push skipped (configure DOCKER_USERNAME and DOCKER_PASSWORD secrets to enable)" >> docker-report.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-report
          path: docker-report.md
