name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR details
        run: |
          echo "# Pull Request Information" > pr-info.md
          echo "" >> pr-info.md
          echo "- **PR Number**: ${{ github.event.pull_request.number }}" >> pr-info.md
          echo "- **Title**: ${{ github.event.pull_request.title }}" >> pr-info.md
          echo "- **Author**: ${{ github.event.pull_request.user.login }}" >> pr-info.md
          echo "- **Base Branch**: ${{ github.event.pull_request.base.ref }}" >> pr-info.md
          echo "- **Head Branch**: ${{ github.event.pull_request.head.ref }}" >> pr-info.md

      - name: Check file changes
        run: |
          echo "" >> pr-info.md
          echo "## Files Changed" >> pr-info.md
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD >> pr-info.md

      - name: Count lines changed
        run: |
          echo "" >> pr-info.md
          echo "## Statistics" >> pr-info.md
          git diff --shortstat origin/${{ github.event.pull_request.base.ref }}...HEAD >> pr-info.md

      - name: Upload PR info
        uses: actions/upload-artifact@v4
        with:
          name: pr-information
          path: pr-info.md

  lint-pr:
    name: Lint PR Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8 black isort pylint

      - name: Run Black formatter check
        run: |
          black --check backend/app mlops/ --line-length=120 || \
          echo "::warning::Code formatting issues found. Run 'black backend/app mlops/ --line-length=120' locally."

      - name: Run isort check
        run: |
          isort --check-only backend/app mlops/ || \
          echo "::warning::Import sorting issues found. Run 'isort backend/app mlops/' locally."

      - name: Run Flake8
        run: |
          flake8 backend/app mlops/ --max-line-length=120 --ignore=E501,W503,E203 || \
          echo "::warning::Linting issues found."

  test-pr:
    name: Test PR Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          pytest tests/ -v --cov=app || echo "::error::Tests failed"

  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Check for dependency conflicts
        run: |
          cd backend
          pip install -r requirements.txt
          pip check || echo "::warning::Dependency conflicts detected"

      - name: Check for security vulnerabilities
        run: |
          pip install safety
          cd backend
          safety check -r requirements.txt || echo "::warning::Security vulnerabilities found"

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          CHANGES=$(git diff --shortstat origin/${{ github.event.pull_request.base.ref }}...HEAD | awk '{print $4+$6}')
          echo "Total lines changed: $CHANGES"

          if [ "$CHANGES" -gt 1000 ]; then
            echo "::warning::This PR is very large ($CHANGES lines). Consider breaking it into smaller PRs."
          fi

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [lint-pr, test-pr, check-dependencies]
    if: always()

    steps:
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const lintStatus = '${{ needs.lint-pr.result }}';
            const testStatus = '${{ needs.test-pr.result }}';
            const depStatus = '${{ needs.check-dependencies.result }}';

            let emoji = '✅';
            let status = 'All checks passed!';

            if (lintStatus !== 'success' || testStatus !== 'success' || depStatus !== 'success') {
              emoji = '⚠️';
              status = 'Some checks failed or have warnings.';
            }

            const body = `
            ## ${emoji} PR Check Results

            ${status}

            - Linting: ${lintStatus === 'success' ? '✅' : '❌'}
            - Tests: ${testStatus === 'success' ? '✅' : '❌'}
            - Dependencies: ${depStatus === 'success' ? '✅' : '❌'}

            ---
            *Automated comment by GitHub Actions*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
