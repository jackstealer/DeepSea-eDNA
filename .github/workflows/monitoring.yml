name: System Monitoring

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Check API health
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::warning::Production API URL not configured"
            exit 0
          fi
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API health check passed (HTTP $RESPONSE)"
          else
            echo "::error::API health check failed (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Check model endpoint
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          if [ -z "$API_URL" ]; then
            exit 0
          fi
          
          RESPONSE=$(curl -s "$API_URL/api/models" || echo "{}")
          echo "Models response: $RESPONSE"

      - name: Test prediction endpoint
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          if [ -z "$API_URL" ]; then
            exit 0
          fi
          
          curl -X POST "$API_URL/api/predict" \
            -H "Content-Type: application/json" \
            -d '{"sequence":"ATCGATCGATCG"}' || echo "::warning::Prediction test failed"

  performance-check:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Measure response time
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "::warning::Production API URL not configured"
            exit 0
          fi
          
          START_TIME=$(date +%s%3N)
          curl -s "$API_URL/health" > /dev/null
          END_TIME=$(date +%s%3N)
          
          RESPONSE_TIME=$((END_TIME - START_TIME))
          echo "Response time: ${RESPONSE_TIME}ms"
          
          if [ $RESPONSE_TIME -gt 5000 ]; then
            echo "::warning::Response time is slow: ${RESPONSE_TIME}ms"
          fi

      - name: Check cache performance
        run: |
          API_URL="${{ secrets.PRODUCTION_API_URL }}"
          if [ -z "$API_URL" ]; then
            exit 0
          fi
          
          CACHE_STATS=$(curl -s "$API_URL/cache/stats" || echo "{}")
          echo "Cache statistics: $CACHE_STATS"

  database-check:
    name: Database Health Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Check database connectivity
        run: |
          echo "Checking database connectivity..."
          # Add database connectivity checks
          # Example: pg_isready for PostgreSQL
          echo "::notice::Database check placeholder"

      - name: Check database size
        run: |
          echo "Checking database size..."
          # Add database size monitoring
          echo "::notice::Database size check placeholder"

  create-monitoring-report:
    name: Create Monitoring Report
    needs: [health-check, performance-check]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Generate report
        run: |
          echo "# System Monitoring Report" > monitoring-report.md
          echo "" >> monitoring-report.md
          echo "## Timestamp" >> monitoring-report.md
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> monitoring-report.md
          echo "" >> monitoring-report.md
          echo "## Health Check Results" >> monitoring-report.md
          echo "- Health Check: ${{ needs.health-check.result }}" >> monitoring-report.md
          echo "- Performance Check: ${{ needs.performance-check.result }}" >> monitoring-report.md
          echo "" >> monitoring-report.md
          echo "## Status" >> monitoring-report.md
          if [ "${{ needs.health-check.result }}" = "success" ] && [ "${{ needs.performance-check.result }}" = "success" ]; then
            echo "🟢 All systems operational" >> monitoring-report.md
          else
            echo "🔴 Issues detected" >> monitoring-report.md
          fi

      - name: Upload monitoring report
        uses: actions/upload-artifact@v3
        with:
          name: monitoring-report-${{ github.run_number }}
          path: monitoring-report.md

      - name: Send notification on failure
        if: failure()
        run: |
          echo "::error::System monitoring detected issues!"
          # Add notification logic (email, Slack, PagerDuty, etc.)
