name: CI - Tests and Linting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run linting
        run: |
          pip install flake8 black isort
          cd backend
          # Lint with flake8
          flake8 app/ --max-line-length=120 --ignore=E501,W503,E203 || true
          # Check formatting with black
          black --check app/ --line-length=120 || true
          # Check imports with isort
          isort --check-only app/ || true

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Archive coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: backend/htmlcov/

  test-mlops:
    name: Test MLOps Features
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Test MLOps imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from mlops.database import DatabaseManager; print('✅ Database import OK')"
          python -c "from mlops.cache_manager import CacheManager; print('✅ Cache import OK')"
          python -c "from mlops.monitoring import MonitoringManager; print('✅ Monitoring import OK')"
          python -c "from mlops.model_versioning import ModelVersionRegistry; print('✅ Versioning import OK')"
          python -c "from mlops.ab_testing import ABTestManager; print('✅ A/B Testing import OK')"

      - name: Run MLOps feature tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          import sys
          from mlops.cache_manager import CacheManager
          from mlops.monitoring import MonitoringManager
          
          # Test CacheManager
          cache = CacheManager()
          assert cache.backend in ['redis', 'in-memory'], 'Cache backend check failed'
          print('✅ CacheManager tests passed')
          
          # Test MonitoringManager
          monitor = MonitoringManager()
          metrics = monitor.get_system_metrics()
          assert 'cpu' in metrics, 'System metrics check failed'
          print('✅ MonitoringManager tests passed')
          
          print('✅ All MLOps feature tests passed!')
          "

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Bandit security linter
        run: |
          pip install bandit
          bandit -r backend/app mlops/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v3
        with:
          name: bandit-security-report
          path: bandit-report.json
        continue-on-error: true

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          pip install flake8 pylint mypy black isort radon

      - name: Check code complexity
        run: |
          radon cc backend/app -a -nb || true
          radon mi backend/app -nb || true

      - name: Run pylint
        run: |
          cd backend
          pip install -r requirements.txt
          pylint app/ --rcfile=../.pylintrc || true
        continue-on-error: true

      - name: Type checking with mypy
        run: |
          cd backend
          mypy app/ --ignore-missing-imports || true
        continue-on-error: true

      - name: Generate quality report
        run: |
          echo "# Code Quality Report" > quality-report.md
          echo "" >> quality-report.md
          echo "## Cyclomatic Complexity" >> quality-report.md
          radon cc backend/app -a >> quality-report.md || true
          echo "" >> quality-report.md
          echo "## Maintainability Index" >> quality-report.md
          radon mi backend/app >> quality-report.md || true

      - name: Upload quality report
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-report
          path: quality-report.md
