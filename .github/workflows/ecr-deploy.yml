name: Build & Deploy to AWS ECR + ECS

on:
  workflow_dispatch:  # Manual trigger only

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 755234501944.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY: deepsea-edna-app
  ECS_CLUSTER: deepsea-cluster
  ECS_SERVICE: deepsea-service

jobs:
  build-and-deploy:
    name: Build, Push to ECR & Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --output json | jq '{status: .service.status, desiredCount: .service.desiredCount}'
          echo "✅ ECS redeployment triggered. Container will start in ~60-90 seconds."

      - name: Verify API health (with retry)
        run: |
          echo "Waiting 90s for container to pull image, download model from S3, and start..."
          sleep 90
          echo "Testing /health endpoint..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://3.107.100.245:8000/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ /health is UP!"
              break
            fi
            sleep 20
          done
          echo ""
          echo "Testing /api/docs endpoint..."
          DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://3.107.100.245:8000/api/docs || echo "000")
          echo "HTTP $DOCS_STATUS"
          if [ "$DOCS_STATUS" = "200" ]; then
            echo "✅ /api/docs is LIVE!"
          else
            echo "⚠️ /api/docs returned $DOCS_STATUS — model may still be loading. Check again in 30s."
          fi

      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECS Cluster** | \`${{ env.ECS_CLUSTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ECS Service** | \`${{ env.ECS_SERVICE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Docs** | http://3.107.100.245:8000/api/docs |" >> $GITHUB_STEP_SUMMARY
