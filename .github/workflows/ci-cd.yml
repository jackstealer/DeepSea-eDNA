# CI/CD pipeline
#
#   lint ─┐
#   backend tests (SQLite + PostgreSQL, incl. MLflow registry tests) ─┼─> E2E: docker compose stack ─> publish images (main / tags)
#   frontend type-check + build ─┘     (Postgres, Redis, MLflow,            to ghcr.io
#                                       model-init, backend, frontend)
#
# The images exercised by the E2E stage are the ones that get published.
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install flake8
        run: pip install flake8
      - name: Syntax errors and undefined names (blocking)
        run: flake8 backend/app backend/training backend/tests mlops scripts --select=E9,F63,F7,F82 --show-source
      - name: Style report (informational)
        run: flake8 backend/app mlops --max-line-length=120 --ignore=E501,W503,E203 --exit-zero --statistics

  backend-tests:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies (CPU-only PyTorch, as in the Docker image)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt
          pip check
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          GIT_PYTHON_REFRESH: quiet
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://test:test@localhost:5432/test' || '' }}
        run: |
          cd backend
          if [ -z "$TEST_DATABASE_URL" ]; then unset TEST_DATABASE_URL; fi
          python -m pytest tests -v -W ignore::DeprecationWarning --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}
          path: backend/test-results.xml

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Security scan (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true
      - name: Bandit
        run: |
          pip install bandit
          bandit -r backend/app mlops -ll || true

  e2e:
    name: E2E (docker compose + MLflow) and publish
    needs: [lint, backend-tests, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment file
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'http://localhost:8000' }}
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^ADMIN_EMAILS=.*|ADMIN_EMAILS=ci-admin@example.com|" .env
          sed -i "s|^BACKEND_PUBLIC_URL=.*|BACKEND_PUBLIC_URL=${PUBLIC_API_URL}|" .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Smoke test (model must be served from the MLflow registry)
        run: |
          python3 scripts/smoke_test.py \
            --api http://localhost:8000 \
            --mlflow http://localhost:5000 \
            --frontend http://localhost:3000 \
            --email ci-admin@example.com \
            --expect-source mlflow \
            --wait 420

      - name: Restart is idempotent (no duplicate model version)
        run: |
          docker compose up -d --force-recreate model-init backend
          python3 scripts/smoke_test.py --api http://localhost:8000 --email ci-admin@example.com --expect-source mlflow --wait 300
          docker compose logs model-init | grep -q "already registered"

      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested images
        if: env.PUBLISH == 'true'
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="$tags latest"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags ${GITHUB_REF_NAME#v}"; fi
          for tag in $tags; do
            docker tag deepsea-edna-api:latest "$repo:$tag"
            docker tag deepsea-edna-web:latest "$repo-web:$tag"
            docker push -q "$repo:$tag"
            docker push -q "$repo-web:$tag"
            echo "- \`$repo:$tag\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- \`$repo-web:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Tear down
        if: always()
        run: docker compose down -v
