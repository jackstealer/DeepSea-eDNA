AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DeepSea eDNA AI - basic AWS deployment. One EC2 instance runs the docker compose stack
  (PostgreSQL, Redis, MLflow, FastAPI, nginx frontend) built from the GitHub repository,
  behind Caddy with automatic Let's Encrypt HTTPS on sslip.io hostnames derived from the
  Elastic IP (no domain or CloudFront needed). Secrets come from SSM Parameter Store.
  Deleting the stack removes everything, including the instance disk and its data.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Compute and network }
        Parameters: [InstanceType, VpcId, SubnetId, LatestAmiId]
      - Label: { default: Application }
        Parameters: [RepoUrl, RepoBranch, ParameterPrefix]

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, c7i-flex.large, m7i-flex.large]
    Description: t3.small (2 GB + swap) is the cheapest size that runs the stack.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC of the subnet below (e.g. the default VPC).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in VpcId (e.g. a default-VPC subnet) for the instance.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  RepoUrl:
    Type: String
    Default: https://github.com/jackstealer/DeepSea-eDNA.git
    AllowedPattern: ^https://.+\.git$
  RepoBranch:
    Type: String
    Default: main
    AllowedPattern: ^[A-Za-z0-9._/-]+$
  ParameterPrefix:
    Type: String
    Default: /deepsea-edna
    AllowedPattern: ^/[A-Za-z0-9_.-]+$
    Description: SSM Parameter Store path holding SECRET_KEY, POSTGRES_PASSWORD, ADMIN_EMAILS and OAuth keys.

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Session Manager access (no SSH keys or open SSH port) and read-only access to this app's SSM parameters.
        must: Keep SSM read access scoped to ParameterPrefix.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: app-bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/*
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Public web ports only. Caddy serves HTTPS on 443 and needs 80 for Let's Encrypt challenges and HTTP-to-HTTPS redirects.
        must: Never open other ports; frontend (3000), API (8000) and MLflow (5000) stay bound to 127.0.0.1.
    Properties:
      GroupDescription: DeepSea eDNA - public HTTP/HTTPS (Caddy)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (ACME challenge and redirect to HTTPS)

  ElasticIp:
    Type: AWS::EC2::EIP
    Metadata:
      com.aws.cloudformation.Context:
        why: Stable public IP; the sslip.io hostnames (and so the HTTPS certificates and OAuth redirect URIs) are derived from it.
    Properties:
      Domain: vpc

  AppNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Metadata:
      com.aws.cloudformation.Context:
        why: The Elastic IP is attached to this interface before the instance boots, so the bootstrap never loses connectivity when the public IP changes.
    Properties:
      SubnetId: !Ref SubnetId
      GroupSet: [!Ref AppSecurityGroup]
      Description: DeepSea eDNA app instance

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      NetworkInterfaceId: !Ref AppNetworkInterface

  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required  # IMDSv2 only
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn: ElasticIpAssociation
    CreationPolicy:
      ResourceSignal:
        Timeout: PT50M  # image builds on a small instance take a while
    Metadata:
      com.aws.cloudformation.Context:
        why: Builds and runs the compose stack; signals CloudFormation only once the app and API answer over HTTPS, so CREATE_COMPLETE means the app works.
        must: Secrets are read from SSM at boot and never placed in user data.
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref AppNetworkInterface
          DeviceIndex: "0"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-app
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euo pipefail
              exec > >(tee -a /var/log/deepsea-bootstrap.log) 2>&1
              signal() { /opt/aws/bin/cfn-signal -e "$1" --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region} || true; }
              trap 'signal 1' ERR

              echo "== swap (headroom for PyTorch + MLflow + PostgreSQL on a small instance)"
              if [ ! -f /swapfile ]; then
                fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile
                echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
              fi
              swapon -a

              echo "== docker"
              dnf install -y docker git aws-cfn-bootstrap
              systemctl enable --now docker
              mkdir -p /usr/local/lib/docker/cli-plugins
              curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64
              curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64
              chmod +x /usr/local/lib/docker/cli-plugins/*
              docker compose version

              echo "== application"
              rm -rf /opt/deepsea
              git clone --depth 1 --branch ${RepoBranch} ${RepoUrl} /opt/deepsea
              cd /opt/deepsea

              # .env from the template + SSM secrets + public URLs (written by python: values may contain any character)
              export SSM_PREFIX='${ParameterPrefix}' AWS_REGION='${AWS::Region}'
              export APP_HOST_NAME='${AppHost}' API_HOST_NAME='${ApiHost}'
              python3 - <<'PY'
              import os, re, subprocess
              def param(name, required=True):
                  cmd = ["aws", "ssm", "get-parameter", "--region", os.environ["AWS_REGION"], "--with-decryption",
                         "--name", os.environ["SSM_PREFIX"] + "/" + name, "--query", "Parameter.Value", "--output", "text"]
                  result = subprocess.run(cmd, capture_output=True, text=True)
                  if result.returncode != 0:
                      if required:
                          raise SystemExit("missing SSM parameter " + name)
                      return ""
                  return result.stdout.strip()
              frontend = "https://" + os.environ["APP_HOST_NAME"]
              backend = "https://" + os.environ["API_HOST_NAME"]
              values = {
                  "SECRET_KEY": param("SECRET_KEY"),
                  "POSTGRES_PASSWORD": param("POSTGRES_PASSWORD"),
                  "ADMIN_EMAILS": param("ADMIN_EMAILS"),
                  "GOOGLE_CLIENT_ID": param("GOOGLE_CLIENT_ID", False),
                  "GOOGLE_CLIENT_SECRET": param("GOOGLE_CLIENT_SECRET", False),
                  "GITHUB_CLIENT_ID": param("GITHUB_CLIENT_ID", False),
                  "GITHUB_CLIENT_SECRET": param("GITHUB_CLIENT_SECRET", False),
                  "APP_HOST": os.environ["APP_HOST_NAME"],
                  "API_HOST": os.environ["API_HOST_NAME"],
                  "FRONTEND_URL": frontend,
                  "BACKEND_PUBLIC_URL": backend,
                  "CORS_ORIGINS": frontend,
                  "VITE_API_BASE_URL": backend,
              }
              text = open(".env.example").read()
              for key, value in values.items():
                  line = key + "=" + value
                  text, n = re.subn("^" + key + "=.*$", lambda m: line, text, flags=re.M)
                  if n == 0:
                      text += "\n" + line + "\n"
              open(".env", "w").write(text)
              os.chmod(".env", 0o600)
              PY

              echo "== build and start (first build takes 10-20 minutes)"
              docker compose -f docker-compose.yml -f deploy/aws/docker-compose.aws.yml up -d --build

              for attempt in $(seq 1 90); do
                if curl -sf --max-time 10 https://${ApiHost}/health && curl -sf --max-time 10 -o /dev/null https://${AppHost}/login; then
                  echo "== healthy over HTTPS"; signal 0; exit 0
                fi
                sleep 10
              done
              docker compose -f docker-compose.yml -f deploy/aws/docker-compose.aws.yml ps -a
              docker compose -f docker-compose.yml -f deploy/aws/docker-compose.aws.yml logs --tail=80
              signal 1
            - AppHost: !Join [".", ["app", !Join ["-", !Split [".", !Ref ElasticIp]], "sslip.io"]]
              ApiHost: !Join [".", ["api", !Join ["-", !Split [".", !Ref ElasticIp]], "sslip.io"]]

Outputs:
  AppUrl:
    Description: Open the application here
    Value: !Join ["", ["https://app.", !Join ["-", !Split [".", !Ref ElasticIp]], ".sslip.io"]]
  ApiUrl:
    Description: Backend API (docs at /api/docs)
    Value: !Join ["", ["https://api.", !Join ["-", !Split [".", !Ref ElasticIp]], ".sslip.io"]]
  GoogleRedirectUri:
    Description: Add this to the Google OAuth client's Authorized redirect URIs
    Value: !Join ["", ["https://api.", !Join ["-", !Split [".", !Ref ElasticIp]], ".sslip.io/auth/oauth/google/callback"]]
  GitHubCallbackUrl:
    Description: Authorization callback URL for a GitHub OAuth App
    Value: !Join ["", ["https://api.", !Join ["-", !Split [".", !Ref ElasticIp]], ".sslip.io/auth/oauth/github/callback"]]
  PublicIp:
    Description: Elastic IP of the instance
    Value: !Ref ElasticIp
  InstanceId:
    Description: EC2 instance (connect with Session Manager; no SSH)
    Value: !Ref AppInstance
  MlflowTunnelCommand:
    Description: Open the private MLflow UI at http://localhost:5000 (needs the Session Manager plugin)
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${AppInstance} --document-name AWS-StartPortForwardingSession --parameters portNumber=5000,localPortNumber=5000
